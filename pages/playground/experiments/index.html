<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiments | Playground</title>
    <script src="../../../scripts/theme-init.js"></script>
    <link rel="stylesheet" href="../../../styles/theme.css" />
    <link rel="stylesheet" href="../../../styles/header.css" />
    <link rel="stylesheet" href="../../../styles/main.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        overflow: hidden;
        background: var(--background-color);
      }
      .experiment-container {
        position: fixed;
        inset: 0;
        cursor: crosshair;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
      .trail {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease-out;
      }
      .info-panel {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        padding: 0.75rem 1rem;
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.875rem;
        color: var(--text-secondary);
        z-index: 100;
      }
      .back-link {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 100;
      }
      .back-link a {
        color: var(--text-color);
        text-decoration: none;
        font-size: 0.875rem;
      }
      .back-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="back-link">
      <a href="../../">&larr; Back to Playground</a>
    </div>
    <div class="experiment-container" id="container"></div>
    <div class="info-panel">
      Move your mouse around. Click to spawn burst.
    </div>
    <script>
      const container = document.getElementById('container');
      const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#f38181', '#aa96da', '#fcbad3'];
      const particles = [];
      const maxParticles = 50;

      // Create trail elements pool
      const trails = [];
      for (let i = 0; i < 20; i++) {
        const trail = document.createElement('div');
        trail.className = 'trail';
        trail.style.background = colors[i % colors.length];
        trail.style.opacity = '0';
        container.appendChild(trail);
        trails.push({ el: trail, x: 0, y: 0, age: 0 });
      }
      let trailIndex = 0;
      let mouseX = 0;
      let mouseY = 0;

      // Track mouse position
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        // Spawn trail
        const t = trails[trailIndex];
        t.x = mouseX;
        t.y = mouseY;
        t.age = 0;
        t.el.style.left = mouseX + 'px';
        t.el.style.top = mouseY + 'px';
        t.el.style.opacity = '0.8';
        t.el.style.transform = `translate(-50%, -50%) scale(${1 - t.age * 0.05})`;
        trailIndex = (trailIndex + 1) % trails.length;
      });

      // Click to spawn burst
      document.addEventListener('click', (e) => {
        const x = e.clientX;
        const y = e.clientY;
        for (let i = 0; i < 12; i++) {
          const angle = (Math.PI * 2 * i) / 12;
          const speed = 3 + Math.random() * 4;
          spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed);
        }
      });

      function spawnParticle(x, y, vx, vy) {
        if (particles.length >= maxParticles) {
          const old = particles.shift();
          old.el.remove();
        }
        const el = document.createElement('div');
        el.className = 'particle';
        const size = 8 + Math.random() * 8;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        container.appendChild(el);

        particles.push({
          el,
          x, y,
          vx, vy,
          life: 1,
          decay: 0.015 + Math.random() * 0.01
        });
      }

      // Animation loop
      function animate() {
        // Update trails
        trails.forEach(t => {
          if (t.age > 0) {
            t.age++;
            const scale = Math.max(0, 1 - t.age * 0.05);
            t.el.style.transform = `translate(-50%, -50%) scale(${scale})`;
            t.el.style.opacity = Math.max(0, 0.8 - t.age * 0.04);
          }
        });

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.life -= p.decay;

          if (p.life <= 0) {
            p.el.remove();
            particles.splice(i, 1);
          } else {
            p.el.style.left = p.x + 'px';
            p.el.style.top = p.y + 'px';
            p.el.style.opacity = p.life;
            p.el.style.transform = `translate(-50%, -50%) scale(${p.life})`;
          }
        }

        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
